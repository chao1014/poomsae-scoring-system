<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景漸層 -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1a4a" />
      <stop offset="100%" stop-color="#090514" />
    </radialGradient>
    
    <!-- 圓環發光漸層 -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff14" />
      <stop offset="50%" stop-color="#00ccff" />
      <stop offset="100%" stop-color="#ff3366" />
    </linearGradient>

    <!-- 剪影發光漸層 -->
    <linearGradient id="kick-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00ccff" />
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 應用程式背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)" />

  <!-- 科技感環繞圓弧 (品勢太極氣流) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ring-grad)" stroke-width="12" stroke-dasharray="800 200" transform="rotate(-45 256 256)" opacity="0.8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#39ff14" stroke-width="4" stroke-dasharray="100 300" transform="rotate(45 256 256)" opacity="0.6" />

  <!-- 跆拳道品勢高踢腿剪影 (精細幾何繪製) -->
  <g transform="translate(140, 100) scale(0.9)" filter="url(#glow)">
    <!-- 支撐腿 (立地) -->
    <path d="M 100 280 L 120 285 L 140 160 L 115 150 Z" fill="url(#kick-grad)" />
    <!-- 軀幹與頭部 -->
    <path d="M 115 150 C 90 140, 80 100, 110 80 C 130 70, 150 90, 145 120 Z" fill="url(#kick-grad)" />
    <!-- 頭盔/頭部 -->
    <circle cx="105" cy="70" r="18" fill="#ffffff" />
    <!-- 伸展的防守手臂 -->
    <path d="M 95 110 Q 50 120, 35 140 L 30 130 Q 50 100, 100 100 Z" fill="url(#kick-grad)" />
    <!-- 收縮的蓄力手臂 -->
    <path d="M 130 115 Q 160 120, 165 135 L 155 140 Q 150 125, 125 120 Z" fill="url(#kick-grad)" />
    <!-- 朝天側踢腿 (伸展天際) -->
    <path d="M 135 155 Q 180 80, 205 -10 L 225 -5 Q 195 90, 145 170 Z" fill="url(#kick-grad)" />
    <!-- 踢擊出的科技感速度光線 -->
    <path d="M 235 -20 L 255 -55 M 245 -5 L 275 -30 M 220 -30 L 235 -55" stroke="#00ccff" stroke-width="6" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- 品勢計分標記 -->
  <text x="256" y="440" font-family="'Microsoft JhengHei', sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="8" opacity="0.9">
    品勢計分
  </text>
</svg>
